<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="暖屿完整低保真：倾诉纠正、心事卡、次日回看、可选奖励、设置授权与反馈异常。"><title>暖屿 · 完整用户流程</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:#263d33;font:15px system-ui,-apple-system,sans-serif}button,select,a{font:inherit}a{color:inherit}button,select{cursor:pointer}header{padding:20px 5vw;border-bottom:1px solid #d4d7cb;display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{font-size:20px}header small{display:block;font-size:12px;margin-top:5px;color:#677467}.actions{display:flex;gap:14px;align-items:center}.actions a{text-decoration:none;font-size:13px}button,select{padding:10px 14px;border:1px solid #b5beb1;border-radius:7px;background:transparent;color:inherit}button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #9e7940;outline-offset:3px}.primary,button[aria-current=true]{background:#264f40;color:white}button:disabled{opacity:.4;cursor:default}.catalog{max-width:1180px;margin:auto;padding:18px 28px 0}#chapters{display:flex;gap:7px;flex-wrap:wrap}#chapters button{font-size:12px;padding:8px 11px}.picker{display:flex;gap:12px;align-items:center;margin-top:12px;font-size:12px}.picker select{max-width:100%;min-width:0;flex:1}.layout{max-width:1180px;margin:auto;padding:24px 28px;display:grid;grid-template-columns:minmax(340px,1fr) minmax(300px,380px);gap:64px}.eyebrow{font-size:12px;color:#758171;margin:8px 0 12px}h1{font-size:30px;line-height:1.4;margin:14px 0 18px}#description{font-size:16px;line-height:1.9}#note{padding-left:15px;border-left:3px solid #afbba8;font-size:13px;line-height:1.8;margin:20px 0;color:#687265}.controls{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}details{margin-top:20px;border-top:1px solid #d0d7c8;padding-top:16px}summary{cursor:pointer}#branches,#choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#choices button,#branches button{font-size:12px;padding:9px 12px}.phone svg{width:100%;height:auto;display:block;max-height:690px}.phone{max-width:365px;margin:auto;width:100%}.caption{font-size:11px;color:#758171;text-align:center;margin:8px 0}footer{max-width:1180px;margin:auto;padding:0 28px 24px;font-size:12px;color:#758171;line-height:1.8}.hidden{display:none!important}@media(max-width:720px){header{padding:16px 20px;align-items:flex-start}header strong{font-size:17px}.actions{flex-shrink:0;flex-direction:column;gap:8px}.catalog{padding:16px 20px 0}.layout{padding:20px;display:flex;flex-direction:column;gap:20px}h1{font-size:25px}.phone{max-width:340px}footer{padding:0 20px 20px}}</style></head><body><header><div><strong>暖屿 / 完整用户流程</strong><small>八组已确认线框 · 主线串讲与可选分支</small></div><div class="actions"><a href="warm-isle-flow.pdf" download>下载完整 PDF ↗</a><button id="restart">从头演示</button></div></header><section class="catalog"><nav id="chapters" aria-label="八组流程目录"></nav><div class="picker"><label for="screenPicker">本组页面</label><select id="screenPicker"></select></div></section><main class="layout"><section><div class="eyebrow" id="counter"></div><h1 id="title"></h1><p id="description"></p><p id="note"></p><div id="choices" aria-label="可选走向"></div><div class="controls"><button id="back">← 返回上一张</button><button id="next" class="primary">下一步 →</button></div><details id="branchDetails"><summary>其他情况 / 分支演示</summary><div id="branches"></div></details></section><section><div id="phone" class="phone"></div><p class="caption">静态线框 · 使用左侧或上方按钮演示，手机内控件为示意</p></section></main><footer>主线演示当日倾诉至次日回看；奖励、授权、删除和异常通过目录或对应入口查看，不是必经步骤。跨日与结果均为演示情境，未接入真实模型、保存或后台。解锁时间、奖励内容及尚未冻结的授权/服务参数继续占位。原手绘 Demo 未修改。<br>依据：PRD V3.2 r8、团队产物对齐 r10及八组确认；2026-11-04。</footer><script>const data={"A01": {"id": "A01", "title": "先知道自己将进入怎样的空间", "desc": "用户先了解小屿的 AI 身份、服务边界与必要的数据处理，再自愿进入。", "note": "不做账号登录；两项勾选默认未选，不同意也可以退出。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">来到暖屿</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"122\" font-size=\"20\" font-weight=\"400\" fill=\"#30322f\">先把今天，轻轻放下。</text><rect x=\"24\" y=\"150\" width=\"292\" height=\"111\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"177\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">小屿是一位 AI 倾听伙伴</text><text x=\"38\" y=\"203\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你可以倾诉，也可以一起整理。</text><text x=\"38\" y=\"226\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这里不提供诊断、治疗，</text><text x=\"38\" y=\"249\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">也没有实时人工值守。</text><rect x=\"24\" y=\"277\" width=\"292\" height=\"135\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"304\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">开始前，了解数据如何使用</text><text x=\"38\" y=\"330\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">聊天内容将用于生成 AI 回复。</text><text x=\"38\" y=\"353\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">必要处理方式见下方数据说明。</text><text x=\"38\" y=\"376\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">存卡、保存心情与历史调用</text><text x=\"38\" y=\"399\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">分别选择，不在此一并开启。</text><text x=\"24\" y=\"438\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">查看数据说明与服务边界  ›</text><text x=\"24\" y=\"475\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">□ 我已成年</text><text x=\"24\" y=\"506\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">□ 我已阅读并同意必要的数据处理</text><rect x=\"24\" y=\"529\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"556\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">同意并进入小屋</text><text x=\"24\" y=\"595\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">暂不进入</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">两个勾选默认未选；满足后主按钮才可用。</text></g></svg>"}, "A02": {"id": "A02", "title": "来到小屋，找到两个明确入口", "desc": "小屋保留手绘氛围，主要操作是“开始倾诉”，次要入口是“信箱”。", "note": "昵称移到设置选填；猫、灯、窗帘不设交互热点。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">暖屿</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">设置</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"106\" width=\"292\" height=\"234\" rx=\"7\" fill=\"#f6f5f0\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><g transform=\"translate(24,106)\" fill=\"none\" stroke=\"#85867e\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 212Q140 206 282 214M23 189L24 36Q132 3 264 37L266 189M28 38L145 9L260 37\" /><path d=\"M45 52L111 50L112 126L44 128Z M77 51L77 127M45 89L111 88M36 48Q43 87 34 132M121 49Q114 89 125 133\" /><path d=\"M142 180Q163 185 219 179M146 187Q181 204 225 185M151 181L153 135Q186 119 217 135L220 180M147 204L151 186M220 203L216 186\" /><path d=\"M165 105Q145 99 153 84Q157 75 166 82Q180 69 193 82Q204 73 210 84Q217 99 199 106Q200 123 182 124Q165 122 165 105ZM165 142Q163 124 181 124Q202 124 202 142M165 144L184 149L201 141L201 167L184 174L165 166Z M184 149L184 174\" /><path d=\"M53 199L54 161L104 161L105 199M62 193L62 176Q80 159 96 176L96 193ZM69 193Q64 183 76 173Q76 183 84 176Q95 188 84 195\" /><path d=\"M235 156L250 156M242 156L242 118M228 119L257 119L251 97L233 97Z\" /></g><text x=\"70\" y=\"331\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">手绘小屋 · 灰阶布局占位</text><text x=\"24\" y=\"373\" font-size=\"20\" font-weight=\"400\" fill=\"#30322f\">今天辛苦了。</text><text x=\"24\" y=\"404\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不必想好怎么说，从一句话开始。</text><rect x=\"24\" y=\"433\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"460\" font-size=\"15\" font-weight=\"500\" fill=\"white\">开始倾诉</text><rect x=\"24\" y=\"488\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"515\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">信箱 · 查看收下的心事</text><text x=\"24\" y=\"568\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 不需要账号登录</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">昵称不拦路；可在后续设置里选填。</text></g></svg>"}, "A03": {"id": "A03", "title": "从一句话开始，不先做问卷", "desc": "默认“先听我说”，直接输入就能开始。用户也可以选择句子起头。", "note": "不强制选模式或评分；建议起头不会自动发送。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"114\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 可以随时纠正我的理解</text><rect x=\"24\" y=\"134\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"161\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"134\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"190\" y=\"161\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">帮我理一理</text><rect x=\"24\" y=\"207\" width=\"268\" height=\"124\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"231\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"255\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">今天辛苦了。</text><text x=\"38\" y=\"278\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">有什么想说的，</text><text x=\"38\" y=\"301\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可以从一句话开始。</text><rect x=\"24\" y=\"360\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"387\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">不知道怎么开口</text><text x=\"24\" y=\"448\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">慢慢说，不用一次说清楚。</text><rect x=\"24\" y=\"509\" width=\"292\" height=\"82\" rx=\"8\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"36\" y=\"535\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想到什么，都可以说…</text><rect x=\"246\" y=\"550\" width=\"58\" height=\"30\" rx=\"5\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"258\" y=\"571\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">发送</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">空输入不可发送；输入后发送，开始当前会话。</text></g></svg>"}, "C01": {"id": "C01", "title": "倾诉后，发现理解偏了", "desc": "例：用户说对方取消见面却没道歉，AI 却把重点放在“临时取消”。", "note": "每条 AI 回复下都有“没理解对”，用户不用重启对话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"113\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 你可以随时纠正我</text><rect x=\"24\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"190\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">帮我理一理</text><rect x=\"48\" y=\"195\" width=\"268\" height=\"94\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"62\" y=\"219\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">我</text><text x=\"62\" y=\"243\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">他又临时取消见面，</text><text x=\"62\" y=\"266\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">连句道歉都没有。</text><rect x=\"24\" y=\"304\" width=\"268\" height=\"122\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"328\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"352\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你提到他临时取消，也没道歉。</text><text x=\"38\" y=\"375\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">是临时取消更让你难受吗？</text><text x=\"24\" y=\"454\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">没理解对  ›</text><text x=\"24\" y=\"497\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">整理心事  ›</text><rect x=\"24\" y=\"523\" width=\"292\" height=\"76\" rx=\"8\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"36\" y=\"548\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想到什么，都可以说…</text><rect x=\"246\" y=\"559\" width=\"58\" height=\"29\" rx=\"5\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"258\" y=\"579\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">发送</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">每条完整 AI 回复下均可纠正；不必等固定轮数。</text></g></svg>"}, "C02": {"id": "C02", "title": "用自己的话纠正这一句", "desc": "点“没理解对”，在弹层里看见原句，写下“我更在意的是，他没道歉”。", "note": "可以取消；纠正仅用于本次会话，并可再次修改。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 返回对话</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">纠正理解</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"102\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">你想纠正这句理解</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">“是临时取消更让你难受吗？”</text><text x=\"24\" y=\"247\" font-size=\"17\" font-weight=\"400\" fill=\"#30322f\">你更想表达的是什么？</text><text x=\"24\" y=\"274\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">用自己的说法写下来</text><rect x=\"24\" y=\"284\" width=\"292\" height=\"112\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"309\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的是，他没道歉。</text><text x=\"24\" y=\"431\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">仅用于这次对话，你可以再次修正。</text><rect x=\"24\" y=\"472\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"499\" font-size=\"15\" font-weight=\"500\" fill=\"white\">按我的说法修正</text><rect x=\"24\" y=\"527\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"554\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">取消，返回对话</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">输入为空时不可提交；取消不改原有理解。</text></g></svg>"}, "C03": {"id": "C03", "title": "理解更新后，原地继续聊", "desc": "修正成功后，下一句立即采用用户的新说法，后续回复与草稿也保持一致。", "note": "保留原消息，不静默改写历史；此时仍可继续说或结束。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"113\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 你可以随时纠正我</text><rect x=\"24\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"190\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">帮我理一理</text><rect x=\"24\" y=\"193\" width=\"292\" height=\"70\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"220\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">已按你的说法修正</text><text x=\"38\" y=\"246\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这次对话会采用你的新说法。</text><rect x=\"48\" y=\"278\" width=\"268\" height=\"87\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"62\" y=\"302\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">我 · 刚刚纠正</text><text x=\"62\" y=\"326\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的是，他没道歉。</text><rect x=\"24\" y=\"380\" width=\"268\" height=\"97\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"404\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"428\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你更在意的是他没道歉。</text><text x=\"38\" y=\"451\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你希望他看到这件事的影响吗？</text><text x=\"24\" y=\"502\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">没理解对  ›</text><text x=\"230\" y=\"502\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">整理心事  ›</text><rect x=\"24\" y=\"523\" width=\"292\" height=\"76\" rx=\"8\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"36\" y=\"548\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想到什么，都可以说…</text><rect x=\"246\" y=\"559\" width=\"58\" height=\"29\" rx=\"5\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"258\" y=\"579\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">发送</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">后续回复与草稿采用新理解；不改写已存卡片。</text></g></svg>"}, "D01": {"id": "D01", "title": "想留一点什么时，再整理心事", "desc": "用户主动点“整理心事”，系统按照这段对话与最新纠正生成草稿。", "note": "生成不等于保存；等待中也可以取消并回到对话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 继续聊</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">整理心事</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"124\" font-size=\"18\" font-weight=\"400\" fill=\"#30322f\">把这段话，整理成一张卡。</text><rect x=\"24\" y=\"162\" width=\"292\" height=\"122\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"189\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">正在整理…</text><text x=\"38\" y=\"215\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">采用这次对话中你确认的说法。</text><text x=\"38\" y=\"238\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">此时还没有存入信箱。</text><rect x=\"24\" y=\"305\" width=\"292\" height=\"104\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"332\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这次采用的理解</text><text x=\"38\" y=\"358\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">“我更在意的是，他没道歉。”</text><rect x=\"24\" y=\"458\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"485\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">取消整理，返回继续聊</text><text x=\"24\" y=\"535\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">不需要等卡片生成才能离开。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">取消后停止本次生成；不清除对话与纠正。</text></g></svg>"}, "D02": {"id": "D02", "title": "先看草稿，再决定要不要留", "desc": "正面包含标题、发生了什么、可选感受和自留话。没有表达的情绪不代填。", "note": "能编辑、保留草稿继续聊，或不保存；只有确认才入信箱。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 继续聊</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">心事卡预览</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"126\" width=\"292\" height=\"276\" rx=\"7\" fill=\"#f7f6f1\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"40\" y=\"151\" font-size=\"11\" font-weight=\"400\" fill=\"#73766f\">今天 · 日期自动记录</text><text x=\"40\" y=\"184\" font-size=\"19\" font-weight=\"600\" fill=\"#30322f\" 20\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">今天发生了什么</text><text x=\"40\" y=\"247\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">他临时取消了见面，也没有道歉。</text><text x=\"40\" y=\"271\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的是没有道歉。</text><text x=\"40\" y=\"313\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">我的感受 · 可选</text><text x=\"40\" y=\"337\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">＋ 添加自己的感受</text><text x=\"40\" y=\"373\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">＋ 想留给自己的话 · 可选</text><rect x=\"24\" y=\"429\" width=\"292\" height=\"79\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"456\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">正在放入信箱…</text><text x=\"38\" y=\"482\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">请稍等，正在确认保存结果。</text><rect x=\"24\" y=\"529\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"557\" font-size=\"15\" font-weight=\"400\" fill=\"#73766f\">正在保存…</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">可返回聊天；后台继续核对，不提前显示成功。</text></g></svg>"}, "D05": {"id": "D05", "title": "卡片留下了，下一步由用户决定", "desc": "成功后可继续聊、查看信箱或结束对话。卡背显示“明日解锁”占位。", "note": "存卡不表示已释怀，也不自动结束或开启历史调用。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\ 292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"482\" font-size=\"15\" font-weight=\"500\" fill=\"white\">继续上次倾诉</text><rect x=\"24\" y=\"510\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"537\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">开始新的倾诉</text><text x=\"24\" y=\"589\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">信箱 · 查看收下的心事  ›</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">未结束会话跨日仍可恢复，不自动结束。</text></g></svg>"}, "B02": {"id": "B02", "title": "恢复：回到原来的对话位置", "desc": "恢复消息、偏好、输入草稿与纠正，不重复开场，也不自动重启生成。", "note": "这条分支回到倾诉主线；不是新会话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"115\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 已恢复上次对话</text><rect x=\"24\" y=\"134\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"161\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"134\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"19 -serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">暖屿</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"94\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">上次倾诉尚未结束</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">当前对话保持原样，等待你的选择。</text><rect x=\"16\" y=\"235\" width=\"308\" height=\"351\" rx=\"15\" fill=\"#f6f5f0\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"24\" y=\"272\" font-size=\"20\" font-weight=\"400\" fill=\"#30322f\">开始一段新的倾诉？</text><text x=\"24\" y=\"310\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">上次未保存的对话、纠正与草稿</text><text x=\"24\" y=\"335\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">将结束，并按数据说明清除。</text><text x=\"24\" y=\"360\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">已放入信箱的卡片会保留。</text><rect x=\"24\" y=\"405\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"432\" font-size=\"15\" font-weight=\"500\" fill=\"white\">先继续上次倾诉</text><rect x=\"24\" y=\"460\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"487\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">结束上次，开始新的倾诉</text><text x=\"24\" y=\"543\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">取消，留在小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">新会话不继承旧聊天与纠正；历史心情默认不调用。</text></g></svg>"}, "C04": {"id": "C04", "title": "不点按钮，也能直接纠 ">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"113\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 你可以随时纠正我</text><rect x=\"24\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"190\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">帮我理一理</text><rect x=\"48\" y=\"195\" width=\"268\" height=\"71\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"62\" y=\"219\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">我</text><text x=\"62\" y=\"243\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不是这个意思。</text><rect x=\"24\" y=\"282\" width=\"268\" height=\"119\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"306\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"330\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我可能理解偏了。</text><text x=\"38\" y=\"353\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你更想表达的是哪一部分？</text><text x=\"38\" y=\"376\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可以直接用你的话告诉我。</text><text x=\"24\" y=\"435\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">尚未改写原理解，等你补充。</text><text x=\"24\" y=\"497\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">整理心事  ›</text><rect x=\"24\" y=\"523\" width=\"292\" height=\"76\" rx=\"8\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"36\" y=\"548\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想到什么，都可以说…</text><rect x=\"246\" y=\"559\" width=\"58\" height=\"29\" rx=\"5\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"258\" y=\"579\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">发送</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不替用户猜答案；明确补充后回到 C03。</text></g></svg>"}, "C06": {"id": "C06", "title": "纠正没提交成功：保留输入", "desc": "失败后保留填写内容，可重试，也可先回到对话。", "note": "纠正成功但回复失败时只重试回复，不重复要求纠正。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 返回对话</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">纠正理解</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"102\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">你想纠正这句理解</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">“是临时取消更让你难受吗？”</text><text x=\"24\" y=\"250\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">你的说法仍在这里</text><rect x=\"24\" y=\"260\" width=\"292\" height=\"103\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"285\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的是，他没道歉。</text><rect x=\"24\" y=\"391\" width=\"292\" height=\"82\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"418\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这次修正还没提交成功</text><text x=\"38\" y=\"444\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">原对话仍在，请重试或返回。</text><rect x=\"24\" y=\"492\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"519\" font-size=\"15\" font-weight=\"500\" fill=\"white\">重试提交</text><rect x=\"24\" y=\"547\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"574\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">保留输入，返回对话</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">只有提交成功才展示“已修正”；返回仍保留草稿。</text></g></svg>"}, "D06": {"id": "D06", "title": "保存失败：草稿仍然在", "desc": "保留用户的手动编辑，可重试同一保存请求，或返回聊天与编辑。", "note": "明确失败才显示此状态；未成功不进信箱、不启动解锁。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 继续聊</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">心事卡草稿</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"276\" rx=\"7\" fill=\"#f7f6f1\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"40\" y=\"137\" font-size=\"11\" font-weight=\"400\" fill=\"#73766f\">今天 · 日期自动记录</text><text x=\"40\" y=\"170\" font-size=\"19\" font-weight=\"600\" fill=\"#30322f\">在意的是没有道歉</text><text x=\"40\" y=\"206\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">今天发生了什么</text><text x=\"40\" y=\"233\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">他临时取消了见面，也没有道歉。</text><text x=\"40\" y=\"257\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的是没有道歉。</text><text x=\"40\" y=\"299\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">我的感受 · 可选</text><text x=\"40\" y=\"323\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">＋ 添加自己的感受</text><text x=\"40\" y=\"359\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">＋ 想留给自己的话 · 可选</text><rect x=\"24\" y=\"405\" width=\"292\" height=\"78\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"432\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">未能保存到信箱</text><text x=\"38\" y=\"458\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你编辑的内容还在，可以重试。</text><rect x=\"24\" y=\"499\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"526\" font-size=\"15\" font-weight=\"500\" fill=\"white\">重试保存</text><text x=\"24\" y=\"576\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">保留草稿，继续聊</text><text x=\"208\" y=\"576\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">返回编辑</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">未成功不计入信箱，也不启动卡背解锁。</text></g></svg>"}, "D07": {"id": "D07", "title": "不保存：只丢弃这张草稿", "desc": "有手动编辑时先确认，避免误丢内容；取消仍回预览。", "note": "对话和纠正保持，不会同时结束聊天。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">心事卡预览</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"91\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">当前草稿 · 尚未存入信箱</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">在意的是没有道歉</text><rect x=\"16\" y=\"231\" width=\"308\" height=\"355\" rx=\"15\" fill=\"#f7f6f1\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"24\" y=\"270\" font-size=\"20\" font-weight=\"400\" fill=\"#30322f\">不保留这张草稿？</text><text x=\"24\" y=\"310\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你编辑过的内容会被丢弃。</text><text x=\"24\" y=\"335\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这次对话和纠正仍然保留，</text><text x=\"24\" y=\"360\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不会同时结束聊天。</text><rect x=\"24\" y=\"409\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"436\" font-size=\"15\" font-weight=\"500\" fill=\"white\">继续编辑</text><rect x=\"24\" y=\"464\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"491\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">丢弃草稿，返回对话</text><text x=\"24\" y=\"546\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">取消，返回预览</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">未手动编辑的草稿可直接不保存，回到对话。</text></g></svg>"}, "D08": {"id": "D08", "title": "继续聊：把草稿暂时留着", "desc": "回到原对话，保留未保存草稿，之后可从草稿入口返回。", "note": "与“不保存”不同，这里不会丢弃草稿或自动重生成。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"114\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 本次对话仍在继续</text><rect x=\"24\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"190\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">帮我理一理</text><rect x=\"24\" y=\"197\" width=\"268\" height=\"97\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"221\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"245\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你更在意的是他没道歉。</text><text x=\"38\" y=\"268\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">愿意再说说这部分吗？</text><text x=\"24\" y=\"321\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">没理解对  ›</text><rect x=\"24\" y=\"343\" width=\"292\" height=\"84\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"370\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">有一张未保存的草稿</text><text x=\"38\" y=\"396\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">保留你刚才的编辑，还没有进信箱。</text><rect x=\"24\" y=\"443\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"470\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">继续查看草稿</text><rect x=\"24\" y=\"510\" width=\"292\" height=\"83\" rx=\"8\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"36\" y=\"537\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想到什么，都可以说…</text><rect x=\"246\" y=\"553\" width=\"58\" height=\"29\" rx=\"5\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"258\" y=\"573\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">发送</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不自动重新生成；点击查看可回 D02。</text></g></svg>"}, "D09": {"id": "D09", "title": "又纠正了理解：提示草稿需更新", "desc": "旧草稿和手动编辑保留，用户决定自己修改或按新说法重新整理。", "note": "覆盖编辑前确认；已经保存的卡片不会被静默改写。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 继续聊</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">心事卡草稿</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"91\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这张草稿需要更新</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你刚才补充了新的理解。</text><rect x=\"24\" y=\"222\" width=\"292\" height=\"106\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"249\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">最新说法</text><text x=\"38\" y=\"275\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">“我在意的是，他没有提前告诉我。”</text><text x=\"24\" y=\"360\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">旧草稿和你的编辑还在。</text><text x=\"24\" y=\"385\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你可以重新整理，或自己修改。</text><rect x=\"24\" y=\"424\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"451\" font-size=\"15\" font-weight=\"500\" fill=\"white\">手动编辑草稿</text><rect x=\"24\" y=\"479\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"506\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">按新说法重新整理</text><text x=\"24\" y=\"563\" font-size=\"13\" font-weight=\"400\" fill=\"#30322f\">保留草稿，返回继续聊</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">未处理前不把旧草稿当作更新完成的版本保存。</text></g></svg>"}, "E01": {"id": "E01", "title": "今天先聊到这里，也可以直接结束", "desc": "从聊天或保存成功页进入结束选择。可以直接结束、先整理心事，或回去继续说。", "note": "第一轮即可结束；不要求存卡或反馈。有草稿时可先查看，取消结束保留原会话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"118\" width=\"292\" height=\"108\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"145\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">今天先聊到这里吗？</text><text x=\"38\" y=\"171\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不需要整理好情绪才能离开。</text><text x=\"38\" y=\"194\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">也可以不保存心事卡、不做反馈。</text><rect x=\"24\" y=\"256\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"283\" font-size=\"15\" font-weight=\"500\" fill=\"white\">直接结束</text><rect x=\"24\" y=\"310\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"337\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">先整理心事</text><rect x=\"24\" y=\"364\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"391\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">继续说</text><rect x=\"24\" y=\"439\" width=\"292\" height=\"111\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"466\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">结束后会怎样？</text><text x=\"38\" y=\"492\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">未保存的对话与草稿将按数据</text><text x=\"38\" y=\"515\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">说明清除，已收下的卡片保留。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">这是结束选择弹层；未确认前，会话仍未结束。</text></g></svg>"}, "E02": {"id": "E02", "title": "对话已经结束，反馈由你决定", "desc": "可选回答刚才的对话是否有帮助，也可以跳过，直接回到小屋。", "note": "先结束会话，再展示反馈；未反馈不是改善。选择更难受时，原因也可留空。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">对话已结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"124\" font-size=\"21\" font-weight=\"400\" fill=\"#30322f\">刚才这段对话，</text><text x=\"24\" y=\"149\" font-size=\"21\" font-weight=\"400\" fill=\"#30322f\">对你有帮助吗？</text><text x=\"24\" y=\"192\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">不想回答也没关系。</text><rect x=\"24\" y=\"222\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"249\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 有一些帮助</text><rect x=\"24\" y=\"274\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"301\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 差不多</text><rect x=\"24\" y=\"326\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"353\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 让我更难受了</text><rect x=\"24\" y=\"378\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"405\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 暂时说不清</text><rect x=\"24\" y=\"451\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"478\" font-size=\"15\" font-weight=\"400\" fill=\"#73766f\">提交反馈并回到小屋</text><rect x=\"24\" y=\"511\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"538\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">跳过，直接回到小屋</text><text x=\"24\" y=\"583\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">不会因为反馈而要求你继续聊天。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">单选，默认未选；选中后提交按钮可用。</text></g></svg>"}, "E03": {"id": "E03", "title": "回到小屋，把离开的选择留给用户", "desc": "可以直接离开、查看已存卡片，或开始一段新的倾诉。", "note": "不宣告已经释怀；结束后不再恢复旧聊天或旧纠正。下一次倾诉是新会话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">暖屿</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">设置</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"106\" width=\"292\" height=\"234\" rx=\"7\" fill=\"#f6f5f0\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><g transform=\"translate(24,106)\" fill=\"none\" stroke=\"#85867e\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 212Q140 206 282 214M23 189L24 36Q132 3 264 37L266 189M28 38L145 9L260 37\" /><path d=\"M45 52L111 50L112 126L44 128Z M77 51L77 127M45 89L111 88M36 48Q43 87 34 132M121 49Q114 89 125 133\" /><path d=\"M142 180Q163 185 219 179M146 187Q181 204 225 185M151 181L153 135Q186 119 217 135L220 180M147 204L151 186M220 203L216 186\" /><path d=\"M165 105Q145 99 153 84Q157 75 166 82Q180 69 193 82Q204 73 210 84Q217 99 199 106Q200 123 182 124Q165 122 165 105ZM165 142Q163 124 181 124Q202 124 202 142M165 144L184 149L201 141L201 167L184 174L165 166Z M184 149L184 174\" /><path d=\"M53 199L54 161L104 161L105 199M62 193L62 176Q80 159 96 176L96 193ZM69 193Q64 183 76 173Q76 183 84 176Q95 188 84 195\" /><path d=\"M235 156L250 156M242 156L242 118M228 119L257 119L251 97L233 97Z\" /></g><text x=\"70\" y=\"331\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">手绘小屋 · 灰阶布局占位</text><text x=\"24\" y=\"373\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">想说的时候，再来就好。</text><text x=\"24\" y=\"404\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不用急着让心情变好。</text><rect x=\"24\" y=\"433\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"460\" font-size=\"15\" font-weight=\"500\" fill=\"white\">开始新的倾诉</text><rect x=\"24\" y=\"488\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"515\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">信箱 · 查看收下的心事</text><text x=\"24\" y=\"566\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 你可以直接离开</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不显示“继续上次”；下一次倾诉是新的会话。</text></g></svg>"}, "E04": {"id": "E04", "title": "更难受也可以如实说，不必解释", "desc": "可选原因：理解错了、建议太多、回应空泛或其他；全不选也能提交。", "note": "不提交则本次选择不保存；不触发强制建议、挽留或继续聊天。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">对话已结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"81\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">已选择：让我更难受了</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你可以不解释原因。</text><text x=\"24\" y=\"228\" font-size=\"15\" font-weight=\"400\" fill=\"#30322f\">如果愿意，告诉我们哪里不合适</text><rect x=\"24\" y=\"250\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"277\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">□ 理解错了</text><rect x=\"24\" y=\"302\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"329\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">□ 建议太多</text><rect x=\"24\" y=\"354\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"381\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">□ 回应空泛</text><rect x=\"24\" y=\"406\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"433\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">□ 其他</text><rect x=\"24\" y=\"466\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"493\" font-size=\"15\" font-weight=\"500\" fill=\"white\">提交反馈并回到小屋</text><rect x=\"24\" y=\"518\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"545\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">不提交，直接回到小屋</text><text x=\"24\" y=\"590\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">修改刚才的选项  ›</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">原因可多选，也可全不选；“其他”不强制填写。</text></g></svg>"}, "E05": {"id": "E05", "title": "反馈失败，也不耽误离开", "desc": "已选内容还在，可以重试，也可以直接回到小屋。", "note": "对话已经结束；反馈失败不会重新打开旧会话。重复提交不重复计数。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">对话已结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"112\" width=\"292\" height=\"108\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"139\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这次反馈还没提交成功</text><text x=\"38\" y=\"165\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">已选内容仍保留在这里。</text><text x=\"38\" y=\"188\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你的对话已经结束。</text><rect x=\"24\" y=\"240\" width=\"292\" height=\"106\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"267\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">你的选择</text><text x=\"38\" y=\"293\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">让我更难受了</text><text x=\"38\" y=\"316\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">原因：理解错了（示例）</text><rect x=\"24\" y=\"387\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"414\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试提交</text><rect x=\"24\" y=\"442\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"469\" font-size=\"15\" font-weight=\"500\" fill=\"white\">直接回到小屋</text><text x=\"24\" y=\"529\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">不重试，也不会重新打开旧对话。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">重试不重复计数；离开后不后台反复索要反馈。</text></g></svg>"}, "E06": {"id": "E06", "title": "还想继续说，就留在这段对话", "desc": "在结束选择里点“继续说”，保留原输入、偏好、纠正和未存草稿。", "note": "只有取消结束才回原会话；已经明确结束后再开聊，是新的会话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 小屋</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">结束</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"114\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 这次对话仍在继续</text><rect x=\"24\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"white\">● 先听我说</text><rect x=\"176\" y=\"133\" width=\"140\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"190\" y=\"160\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">帮我理一理</text><rect x=\"24\" y=\"197\" width=\"268\" height=\"103\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"221\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"245\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你更在意的是他没道歉。</text><text x=\"38\" y=\"268\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">愿意再说说这部分吗？</text><text x=\"24\" y=\"326\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">没理解对  ›</text><rect x=\"24\" y=\"351\" width=\"292\" height=\"80\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"378\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">未保存的草稿仍在</text><text x=\"38\" y=\"404\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">继续查看草稿  ›</text><rect x=\"24\" y=\"479\" width=\"292\" height=\"112\" rx=\"8\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"36\" y=\"506\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我还想再说一点……</text><rect x=\"246\" y=\"548\" width=\"58\" height=\"30\" rx=\"5\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"258\" y=\"569\" font-size=\"13\" font-weight=\"400\" fill=\"white\">发送</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">保留已有输入、偏好、纠正与草稿；不重发开场白。</text></g></svg>"}, "F01": {"id": "F01", "title": "再次回来，主动打开信箱", "desc": "从小屋打开信箱，看到自己确认保存的心事卡；这里以次日主动回访为演示情境。", "note": "演示跨日场景，不代表时间已真实流逝；无推送，未保存的草稿不入信箱。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">信箱</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"120\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">收下的心事，放在这里。</text><text x=\"24\" y=\"151\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想看的时候再打开。</text><rect x=\"24\" y=\"179\" width=\"292\" height=\"135\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"206\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">11 月 04 日 · 那句没等到的道歉</text><text x=\"38\" y=\"232\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我在意的是，对方没有道歉。</text><text x=\"38\" y=\"255\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">正面可看 · 卡背待解锁  ›</text><rect x=\"24\" y=\"334\" width=\"292\" height=\"135\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"361\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">11 月 03 日 · 没被看见的付出</text><text x=\"38\" y=\"387\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">比起忙碌，我更在意被看见。</text><text x=\"38\" y=\"410\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">卡背已解锁 · 点击查看  ›</text><rect x=\"24\" y=\"528\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"555\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">按保存时间排序；只展示用户确认保存的卡片。</text></g></svg>"}, "F02": {"id": "F02", "title": "先看当时认可的心事卡正面", "desc": "日期、发生的事、在意的部分和当时的感受都保留在正面；可从更多里编辑、复制或删除。", "note": "正面随时可看；本页演示卡背已解锁，未解锁和加载失败见分支。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">‹ 信箱</text><text x=\"100\" y=\"69\" font-size=\"18\" font-weight=\"600\" fill=\"#30322f\">心事卡</text><text x=\"286\" y=\"69\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">更多</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"119\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">11 月 03 日 · 正面</text><rect x=\"24\" y=\"145\" width=\"292\" height=\"262\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"172\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">没被看见的付出</text><text x=\"38\" y=\"198\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">发生的事</text><text x=\"38\" y=\"221\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">完成的工作没有被提到。</text><text x=\"38\" y=\"244\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我在意的</text><text x=\"38\" y=\"267\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">自己的付出能被看见。</text><text x=\"38\" y=\"290\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">当时的感受：失落、委屈。</text><rect x=\"24\" y=\"434\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"461\" font-size=\"15\" font-weight=\"500\" fill=\"white\">翻到背面 · 已解锁</text><rect x=\"24\" y=\"490\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"517\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回信箱</text><text x=\"24\" y=\"572\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">更多：编辑正面 / 复制 / 删除</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">打开即展示原正面；看卡不等于开启新会话。</text></g></svg>"}, "F03": {"id": "F03", "title": "次日翻到背面，给感受留一点余地", "desc": "主动翻面后看到承接原卡片的文字；可以直接离开，也可以记录此刻的心情。", "note": "解锁时间仍占位；不宣告释怀，不强迫原谅；重复翻卡使用同一版本。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 正面</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">卡片背面</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"120\" width=\"292\" height=\"284\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"147\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">留给今天的你</text><text x=\"38\" y=\"173\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">昨天，你希望付出被看见。</text><text x=\"38\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">那份在意可以先放在这里，</text><text x=\"38\" y=\"219\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不必急着替它找到答案。</text><text x=\"38\" y=\"242\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">今天如果仍有委屈，</text><text x=\"38\" y=\"265\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">也可以慢慢说。</text><text x=\"24\" y=\"429\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">AI 生成 · 基于你确认的心事卡</text><rect x=\"24\" y=\"460\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"487\" font-size=\"15\" font-weight=\"500\" fill=\"white\">记录此刻的心情（可选）</text><rect x=\"24\" y=\"515\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"542\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">先不记录，回到小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">示例文案；不宣告释怀、不解释他人动机。</text></g></svg>"}, "F04": {"id": "F04", "title": "此刻的心情，可以记录也可以跳过", "desc": "可选比昨天好些、差不多、更难受或说不清；默认不选，选中后才能保存。", "note": "默认仅本地记录；不自动上传或授权模型历史调用，与当日对话帮助反馈分开。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 卡背</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">此刻的心情</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"122\" font-size=\"21\" font-weight=\"400\" fill=\"#30322f\">和昨天相比，</text><text x=\"24\" y=\"147\" font-size=\"21\" font-weight=\"400\" fill=\"#30322f\">现在感觉怎么样？</text><rect x=\"24\" y=\"201\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"228\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 比昨天好些</text><rect x=\"24\" y=\"252\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"279\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 差不多</text><rect x=\"24\" y=\"303\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"330\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 更难受</text><rect x=\"24\" y=\"354\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"381\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 说不清</text><text x=\"24\" y=\"425\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">本次仅保存在这台设备。</text><text x=\"24\" y=\"450\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">不会自动用于 AI 的新对话。</text><rect x=\"24\" y=\"478\" width=\"292\" height=\"43\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"505\" font-size=\"15\" font-weight=\"400\" fill=\"#73766f\">保存心情记录</text><rect x=\"24\" y=\"539\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"566\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">跳过，回到小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">选中后保存可用；云端保存与历史使用另行授权。</text></g></svg>"}, "F05": {"id": "F05", "title": "如实记下感受，然后自由离开", "desc": "这里演示选择更难受后的保存成功；差不多和说不清使用同样结构。", "note": "不强制说明原因，不以奖励诱导改选；可以返回卡片，或回到小屋。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">心情已记录</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"128\" width=\"292\" height=\"117\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"155\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">已记下：更难受（示例）</text><text x=\"38\" y=\"181\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">谢谢你如实告诉自己。</text><text x=\"38\" y=\"204\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不用急着让感受变好。</text><rect x=\"24\" y=\"306\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"333\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><rect x=\"24\" y=\"362\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"389\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回这张卡片</text><text x=\"24\" y=\"444\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">想说的时候，可以从小屋再开始。</text><text x=\"24\" y=\"469\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">不会自动恢复已经结束的对话。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">其余非改善选项同结构；不展示改善奖励。</text></g></svg>"}, "F07": {"id": "F07", "title": "信箱还空着，也没关系", "desc": "没有已存心事时展示空状态，可以直接回到小屋。", "note": "不把读取失败显示成空信箱，不强制登录、开聊或存卡。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">信箱</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><g fill=\"none\" stroke=\"#73766f\" stroke-width=\"2\"><path d=\"M110 180L230 177L232 268L108 270ZM110 180L170 224L230 177M108 270L150 222M232 268L191 221\" /></g><text x=\"24\" y=\"322\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">这里还没有收下的心事。</text><text x=\"24\" y=\"365\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">想留的时候，再放进来就好。</text><rect x=\"24\" y=\"464\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"491\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不强制开聊、存卡或登录；不伪造示例为真实记录。</text></g></svg>"}, "F08": {"id": "F08", "title": "正面能看，卡背等待解锁", "desc": "展示预计解锁时间占位，不要求用户留在页面等待。", "note": "未存草稿不启动解锁；时间与时区规则仍待确定，不显示虚构倒计时。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 信箱</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">心事卡</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"120\" width=\"292\" height=\"183\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"147\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">正面仍然可以查看</text><text x=\"38\" y=\"173\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">那句没等到的道歉</text><text x=\"38\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的是，对方没有道歉。</text><text x=\"38\" y=\"219\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这让我感到委屈。</text><rect x=\"24\" y=\"329\" width=\"292\" height=\"124\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"356\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">卡背还在等下一次见面</text><text x=\"38\" y=\"382\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">预计解锁：[次日时间待确认]</text><text x=\"38\" y=\"405\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">无需停留在这里等待。</text><rect x=\"24\" y=\"494\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"521\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回信箱</text><rect x=\"24\" y=\"548\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"575\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不显示虚构倒计时；未存草稿不启动解锁。</text></g></svg>"}, "F09": {"id": "F09", "title": "卡背没打开，也不影响原来的卡片", "desc": "加载、联网校验与失败分别提示；可以重试、返回正面或回小屋。", "note": "离线无法可靠校验时不假装已解锁；重试不重复生成多个版本。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 正面</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">卡片背面</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"122\" width=\"292\" height=\"140\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"149\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">暂时没能打开卡背</text><text x=\"38\" y=\"175\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">卡片正面仍在。</text><text x=\"38\" y=\"198\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">请稍后重试，或先离开。</text><rect x=\"24\" y=\"310\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"337\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试打开</text><rect x=\"24\" y=\"365\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"392\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回正面</text><rect x=\"24\" y=\"420\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"447\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">回到小屋</text><rect x=\"24\" y=\"499\" width=\"292\" height=\"86\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"526\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">其他状态文案</text><text x=\"38\" y=\"552\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">加载中：正在打开卡背……</text><text x=\"38\" y=\"575\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">离线：联网后确认解锁状态。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">加载中也可退出；无法校验时不冒充已解锁。</text></g></svg>"}, "F10": {"id": "F10", "title": "心情没保存成功，保留选择", "desc": "可以重试、返回修改，或者不保存直接回小屋。", "note": "成功后才进入结果页；失败、跳过与未填写都不算改善。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">此刻的心情</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"125\" width=\"292\" height=\"122\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"152\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">还没保存成功</text><text x=\"38\" y=\"178\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">已选内容仍保留在这里。</text><text x=\"38\" y=\"201\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你的心事卡不受影响。</text><rect x=\"24\" y=\"271\" width=\"292\" height=\"79\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"298\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">本次选择</text><text x=\"38\" y=\"324\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">比昨天好些（示例）</text><rect x=\"24\" y=\"391\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"418\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试保存</text><rect x=\"24\" y=\"448\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"475\" font
