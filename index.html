-size=\"15\" font-weight=\"500\" fill=\"white\">不保存，回到小屋</text><rect x=\"24\" y=\"505\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"532\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回修改选择</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">失败不展示已保存或已领取；离开仍自由。</text></g></svg>"}, "F11": {"id": "F11", "title": "修改正面时，明确背面也需要更新", "desc": "编辑保存后，经用户确认才更新关联背面；取消或失败保留原卡。", "note": "修改正面不重置解锁时间；更新卡背须确认，更新失败不丢正面。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 取消</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">编辑正面</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"116\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">标题</text><rect x=\"24\" y=\"126\" width=\"292\" height=\"42\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"151\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">没被看见的付出</text><text x=\"24\" y=\"190\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">发生的事</text><rect x=\"24\" y=\"200\" width=\"292\" height=\"60\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"225\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">完成的工作没有被提到。</text><text x=\"24\" y=\"282\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">我在意的 / 当时的感受</text><rect x=\"24\" y=\"292\" width=\"292\" height=\"78\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"317\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">希望付出被看见。</text><text x=\"36\" y=\"339\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">失落、委屈。</text><rect x=\"24\" y=\"398\" width=\"292\" height=\"101\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"425\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这张卡已有背面</text><text x=\"38\" y=\"451\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">保存修改后，背面需要更新。</text><text x=\"38\" y=\"474\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">由你确认后再重新生成。</text><rect x=\"24\" y=\"527\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"554\" font-size=\"15\" font-weight=\"500\" fill=\"white\">保存修改并确认更新</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">未解锁卡片只保存正面；解锁时间不重置。</text></g></svg>"}, "F12": {"id": "F12", "title": "删除前，说明会移除什么", "desc": "确认删除卡片正反面与关联心情记录，也可以取消保留。", "note": "删除完成才显示成功；处理中、失败可重试。复制另提供结果提示，不自动分享。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 心事卡</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">删除确认</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"120\" width=\"292\" height=\"163\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"147\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">删除这张心事卡？</text><text x=\"38\" y=\"173\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">卡片正反面将从信箱移除。</text><text x=\"38\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">删除后不能恢复。</text><text x=\"38\" y=\"219\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">关联心情记录一并删除。</text><rect x=\"24\" y=\"331\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"358\" font-size=\"15\" font-weight=\"500\" fill=\"white\">取消，保留卡片</text><rect x=\"24\" y=\"388\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"415\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">确认删除</text><rect x=\"24\" y=\"468\" width=\"292\" height=\"112\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"495\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">删除状态</text><text x=\"38\" y=\"521\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">处理中 / 已完成 / 失败可重试</text><text x=\"38\" y=\"544\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">处理未完成时如实显示状态，</text><text x=\"38\" y=\"567\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不会把它当成可继续翻看的卡片。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">单卡删除不等于清空信箱；不静默删除其他卡片。</text></g></svg>"}, "F-return": {"id": "F-return", "title": "回看结束，回到熟悉的小屋", "desc": "这次回看已结束，可以直接离开；想说的时候，再开始一段新的倾诉。", "note": "没有反馈、没有改善或没有领取奖励，都不影响离开。信箱里的其余卡片照常保留。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">暖屿</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">设置</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"106\" width=\"292\" height=\"234\" rx=\"7\" fill=\"#f6f5f0\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><g transform=\"translate(24,106)\" fill=\"none\" stroke=\"#85867e\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 212Q140 206 282 214M23 189L24 36Q132 3 264 37L266 189M28 38L145 9L260 37\" /><path d=\"M45 52L111 50L112 126L44 128Z M77 51L77 127M45 89L111 88M36 48Q43 87 34 132M121 49Q114 89 125 133\" /><path d=\"M142 180Q163 185 219 179M146 187Q181 204 225 185M151 181L153 135Q186 119 217 135L220 180M147 204L151 186M220 203L216 186\" /><path d=\"M165 105Q145 99 153 84Q157 75 166 82Q180 69 193 82Q204 73 210 84Q217 99 199 106Q200 123 182 124Q165 122 165 105ZM165 142Q163 124 181 124Q202 124 202 142M165 144L184 149L201 141L201 167L184 174L165 166Z M184 149L184 174\" /><path d=\"M53 199L54 161L104 161L105 199M62 193L62 176Q80 159 96 176L96 193ZM69 193Q64 183 76 173Q76 183 84 176Q95 188 84 195\" /><path d=\"M235 156L250 156M242 156L242 118M228 119L257 119L251 97L233 97Z\" /></g><text x=\"70\" y=\"331\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">手绘小屋 · 灰阶布局占位</text><text x=\"24\" y=\"373\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">想说的时候，再来就好。</text><text x=\"24\" y=\"404\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不用急着让心情变好。</text><rect x=\"24\" y=\"433\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"460\" font-size=\"15\" font-weight=\"500\" fill=\"white\">开始新的倾诉</text><rect x=\"24\" y=\"488\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"515\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">信箱 · 查看收下的心事</text><text x=\"24\" y=\"566\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI · 你可以直接离开</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不显示“继续上次”；下一次倾诉是新的会话。</text></g></svg>"}, "G01": {"id": "G01", "title": "确认好转 / 可选入口", "desc": "次日心情记录保存成功，且用户主动选择“比昨天好些”，才出现一次可选心意入口。此页承接原 F06，不重复询问是否好转。", "note": "不在心情选择前预告奖励，避免诱导作答。 默认不领取；跳过直接去 G06。 其余心情选项仍正常获得支持与退出。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">心情已记录</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"117\" width=\"292\" height=\"98\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"144\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">已记下：比昨天好些</text><text x=\"38\" y=\"170\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这是你此刻的感受。</text><text x=\"38\" y=\"193\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不用要求自己一直保持。</text><rect x=\"24\" y=\"253\" width=\"292\" height=\"126\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"280\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">一份可以选择收下的心意</text><text x=\"38\" y=\"306\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">如果愿意，可以看看。</text><text x=\"38\" y=\"329\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">也可以就这样回到小屋。</text><rect x=\"24\" y=\"416\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"443\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">看看这份心意</text><rect x=\"24\" y=\"474\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"501\" font-size=\"15\" font-weight=\"500\" fill=\"white\">跳过，回到小屋</text><text x=\"24\" y=\"557\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">不领取，也不影响你的心情记录。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">承接 F06，同一页面延续；不重复询问是否好转。</text></g></svg>"}, "G02": {"id": "G02", "title": "奖励预览 / 自愿领取", "desc": "先看奖励预览，再由用户决定领取或跳过。奖励名称、内容与形式继续占位。", "note": "只是预览，不代表已领取。 领取中防重复点击，结果以实际状态为准。 返回 G01 仍可跳过，不追加确认挽留。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 返回</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">一份小心意</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"117\" width=\"292\" height=\"168\" rx=\"9\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" stroke-dasharray=\"5 5\" /><g fill=\"none\" stroke=\"#73766f\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M140 143L198 141L200 193L138 195ZM138 159L200 157M169 142L169 194M168 141Q145 122 144 137Q148 144 168 141Q191 121 194 135Q192 144 168 141\" /></g><text x=\"91\" y=\"225\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">奖励内容 / 形式占位</text><text x=\"67\" y=\"251\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">示意符号，不代表最终奖励造型</text><text x=\"24\" y=\"323\" font-size=\"17\" font-weight=\"400\" fill=\"#30322f\">这份心意，你可以自己决定。</text><text x=\"24\" y=\"360\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">领取不需要分享、打卡或付费。</text><rect x=\"24\" y=\"412\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"439\" font-size=\"15\" font-weight=\"500\" fill=\"white\">收下这份心意</text><rect x=\"24\" y=\"468\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"495\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">跳过，回到小屋</text><text x=\"24\" y=\"548\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">奖励名称、内容与形式待确认。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">点领取后显示“正在领取…”；退出入口始终保留。</text></g></svg>"}, "G03": {"id": "G03", "title": "首次领取成功 / 明确结果", "desc": "只有确认发放成功才显示领取成功。可返回对应卡片，或直接回小屋。", "note": "已领取心意从对应心事卡再次查看；不另设奖励仓库，不要求分享或继续使用。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">领取成功</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"118\" width=\"292\" height=\"168\" rx=\"9\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" stroke-dasharray=\"5 5\" /><g fill=\"none\" stroke=\"#73766f\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M140 144L198 142L200 194L138 196ZM138 160L200 158M169 143L169 195M168 142Q145 123 144 138Q148 145 168 142Q191 122 194 136Q192 145 168 142\" /></g><text x=\"91\" y=\"226\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">奖励内容 / 形式占位</text><text x=\"67\" y=\"252\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">示意符号，不代表最终奖励造型</text><text x=\"24\" y=\"328\" font-size=\"20\" font-weight=\"400\" fill=\"#30322f\">这份心意已经收下了。</text><text x=\"24\" y=\"371\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">想看的时候，再从这张卡片打开。</text><rect x=\"24\" y=\"425\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"452\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><rect x=\"24\" y=\"481\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"508\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回这张心事卡</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">只有确认领取成功才展示；领取不等于情绪改善。</text></g></svg>"}, "G04": {"id": "G04", "title": "已领取 / 再次查看", "desc": "独立分支：已领取后再次查看 → G04；G02 领取失败 → G05；任意奖励页选择离开 → G06。", "note": "重复点击或重试不重复发放。 同一记录重复好转、改反馈不无限发奖。 已领后修改心情不强行追缴奖励。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 心事卡</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">已收下的心意</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"119\" width=\"292\" height=\"168\" rx=\"9\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" stroke-dasharray=\"5 5\" /><g fill=\"none\" stroke=\"#73766f\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M140 145L198 143L200 195L138 197ZM138 161L200 159M169 144L169 196M168 143Q145 124 144 139Q148 146 168 143Q191 123 194 137Q192 146 168 143\" /></g><text x=\"91\" y=\"227\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">奖励内容 / 形式占位</text><text x=\"67\" y=\"253\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">示意符号，不代表最终奖励造型</text><text x=\"24\" y=\"329\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">这份心意已经领取过了。</text><text x=\"24\" y=\"369\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">可以再看看，无需重复领取。</text><rect x=\"24\" y=\"425\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"452\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回这张心事卡</text><rect x=\"24\" y=\"481\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"508\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">仅同一奖励记录显示已领取；不重发、不覆盖。</text></g></svg>"}, "G05": {"id": "G05", "title": "明确失败 / 可重试或离开", "desc": "独立分支：已领取后再次查看 → G04；G02 领取失败 → G05；任意奖励页选择离开 → G06。", "note": "重试成功 → G03；已领取 → G04。 重试不重填心情，失败不回滚反馈。 失败也可直接离开，不把退出当领取成功。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">领取未成功</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"121\" width=\"292\" height=\"126\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"148\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这次没能领到心意</text><text x=\"38\" y=\"174\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">刚才的心情已经记录。</text><text x=\"38\" y=\"197\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">心事卡也仍然保留。</text><rect x=\"24\" y=\"278\" width=\"292\" height=\"89\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"305\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">待领取的内容</text><text x=\"38\" y=\"331\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">奖励内容占位 · 尚未领取</text><rect x=\"24\" y=\"409\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"436\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试领取</text><rect x=\"24\" y=\"465\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"492\" font-size=\"15\" font-weight=\"500\" fill=\"white\">先离开，回到小屋</text><text x=\"24\" y=\"553\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">不用重新填写心情，也不用改选项。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">仅明确失败用此页；结果不明时先核对领取状态。</text></g></svg>"}, "G06": {"id": "G06", "title": "跳过 / 离开后回到小屋", "desc": "独立分支：已领取后再次查看 → G04；G02 领取失败 → G05；任意奖励页选择离开 → G06。", "note": "跳过不删除心情或卡片，不重复催领；领取中离开后以实际结果为准。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">暖屿</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">设置</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"106\" width=\"292\" height=\"234\" rx=\"7\" fill=\"#f6f5f0\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><g transform=\"translate(24,106)\" fill=\"none\" stroke=\"#85867e\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 212Q140 206 282 214M23 189L24 36Q132 3 264 37L266 189M28 38L145 9L260 37\" /><path d=\"M45 52L111 50L112 126L44 128Z M77 51L77 127M45 89L111 88M36 48Q43 87 34 132M121 49Q114 89 125 133\" /><path d=\"M142 180Q163 185 219 179M146 187Q181 204 225 185M151 181L153 135Q186 119 217 135L220 180M147 204L151 186M220 203L216 186\" /><path d=\"M165 105Q145 99 153 84Q157 75 166 82Q180 69 193 82Q204 73 210 84Q217 99 199 106Q200 123 182 124Q165 122 165 105ZM165 142Q163 124 181 124Q202 124 202 142M165 144L184 149L201 141L201 167L184 174L165 166Z M184 149L184 174\" /><path d=\"M53 199L54 161L104 161L105 199M62 193L62 176Q80 159 96 176L96 193ZM69 193Q64 183 76 173Q76 183 84 176Q95 188 84 195\" /><path d=\"M235 156L250 156M242 156L242 118M228 119L257 119L251 97L233 97Z\" /></g><text x=\"70\" y=\"331\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">手绘小屋 · 灰阶布局占位</text><text x=\"24\" y=\"374\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">想说的时候，再来就好。</text><text x=\"24\" y=\"410\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">此刻的感受，可以先放在这里。</text><rect x=\"24\" y=\"449\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"476\" font-size=\"15\" font-weight=\"500\" fill=\"white\">开始新的倾诉</text><rect x=\"24\" y=\"503\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"530\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">信箱 · 查看收下的心事</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不弹挽留、不发催领提示、不显示损失或倒计时。</text></g></svg>"}, "H01": {"id": "H01", "title": "设置入口 / 选择分开", "desc": "从小屋设置进入。云端保存与 AI 历史使用各自控制；不增加账号登录，不把本地保存视为授权。", "note": "三个选择独立：本地卡片、云端心情、AI 历史。两项授权默认关闭，反馈申诉和服务边界均可从这里进入。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">设置</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"121\" font-size=\"17\" font-weight=\"400\" fill=\"#30322f\">由你决定，留下和使用什么。</text><rect x=\"24\" y=\"154\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"181\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">数据说明  ›</text><rect x=\"24\" y=\"212\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"239\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">心情记录  ›</text><rect x=\"24\" y=\"270\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"297\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">云端保存心情记录 · 关闭  ›</text><rect x=\"24\" y=\"328\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"355\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">新对话使用历史心情 · 关闭  ›</text><rect x=\"24\" y=\"386\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"413\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">反馈与申诉  ›</text><rect x=\"24\" y=\"498\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"525\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">清空我的数据  ›</text><text x=\"24\" y=\"558\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">拒绝授权，也可以继续使用基本功能。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">本轮不增加账号登录；授权为用户端交互示意。</text><rect x=\"24\" y=\"440\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\"/><text x=\"38\" y=\"467\" font-size=\"15\" fill=\"#30322f\">关于暖屿 / 服务边界  ›</text></g></svg>"}, "H02": {"id": "H02", "title": "本地保存 / 云端 / AI 使用", "desc": "小屋“设置”进入 H01；数据说明 → H02；云端心情记录 → H03。H02 与 H03 为独立入口。", "note": "不承诺聊天和卡片跨设备同步。 云端心情记录不等于模型获准使用。 具体留存与服务条款文案待确定。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">数据说明</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"111\" width=\"292\" height=\"116\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"138\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">卡片与未结束的对话</text><text x=\"38\" y=\"164\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">保存在当前设备。</text><text x=\"38\" y=\"187\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">卡片保留至你删除；未存内容</text><text x=\"38\" y=\"210\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">在明确结束后按告知规则清除。</text><rect x=\"24\" y=\"245\" width=\"292\" height=\"115\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"272\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">心情记录</text><text x=\"38\" y=\"298\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">默认只在本地记录。</text><text x=\"38\" y=\"321\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">云端保存需另行同意；</text><text x=\"38\" y=\"344\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不会自动上传聊天或卡片正文。</text><rect x=\"24\" y=\"378\" width=\"292\" height=\"112\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"405\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">AI 使用历史心情</text><text x=\"38\" y=\"431\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">默认关闭，需要单独开启。</text><text x=\"38\" y=\"454\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">关闭后仍能倾诉、看卡和领奖。</text><text x=\"38\" y=\"477\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不自动继承旧聊天与旧纠正。</text><text x=\"24\" y=\"521\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">换机、卸载后可能无法恢复本地内容。</text><rect x=\"24\" y=\"555\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"582\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回设置</text></g></svg>"}, "H03": {"id": "H03", "title": "单独告知 / 默认关闭", "desc": "小屋“设置”进入 H01；数据说明 → H02；云端心情记录 → H03。H02 与 H03 为独立入口。", "note": "仅保存开启后的新记录，不自动补传旧记录；取消或失败保持原状态，基本功能仍可用。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">云端心情记录</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"117\" font-size=\"19\" font-weight=\"400\" fill=\"#30322f\">允许云端保存心情记录？</text><rect x=\"24\" y=\"144\" width=\"292\" height=\"146\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"171\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">保存什么、用来做什么</text><text x=\"38\" y=\"197\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">日期、自报选项、关联卡片标识</text><text x=\"38\" y=\"220\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">等必要字段；用于心情记录管理</text><text x=\"38\" y=\"243\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">与去标识统计。</text><text x=\"38\" y=\"266\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不包含聊天和卡片正文。</text><rect x=\"24\" y=\"308\" width=\"292\" height=\"120\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"335\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">授权信息（待补全）</text><text x=\"38\" y=\"361\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">处理方：[待确认]</text><text x=\"38\" y=\"384\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">保留期：[待确认]</text><text x=\"38\" y=\"407\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">撤回与删除：设置 → 心情记录</text><rect x=\"24\" y=\"455\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"482\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">同意云端保存（评审示意）</text><rect x=\"24\" y=\"511\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"538\" font-size=\"15\" font-weight=\"500\" fill=\"white\">暂不开启</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">正式开启前须补齐说明；不因保存本地卡片自动同意。</text></g></svg>"}, "H04": {"id": "H04", "title": "允许 AI 使用 / 单独授权", "desc": "H04 同意并生效 → H05；H05 主动关闭并生效 → H06。不增加“确认是否确定”的挽留弹层。", "note": "不开启也能正常聊天和回看。 范围、处理方等未确定前仅展示评审状态。 不把本地记录许可替代模型使用授权。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">历史心情使用</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"117\" font-size=\"17\" font-weight=\"400\" fill=\"#30322f\">新对话可以参考历史心情吗？</text><rect x=\"24\" y=\"145\" width=\"292\" height=\"145\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"172\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">只参考你记录过的感受</text><text x=\"38\" y=\"198\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可用日期、自报心情与必要版本。</text><text x=\"38\" y=\"221\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不读取旧聊天、旧纠正或卡片正文。</text><text x=\"38\" y=\"244\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">过去的记录不代表你现在的状态。</text><rect x=\"24\" y=\"311\" width=\"292\" height=\"113\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"338\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">使用范围（待确认）</text><text x=\"38\" y=\"364\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">时间范围：[待确认]</text><text x=\"38\" y=\"387\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">最多记录条数：[待确认]</text><text x=\"38\" y=\"410\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">处理方与留存说明：[待补全]</text><rect x=\"24\" y=\"455\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"482\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">同意开启（评审示意）</text><rect x=\"24\" y=\"511\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"538\" font-size=\"15\" font-weight=\"500\" fill=\"white\">暂不开启</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">无可用历史仍正常聊天；不自动开启云端保存。</text></g></svg>"}, "H05": {"id": "H05", "title": "已开启 / 可随时关闭", "desc": "H04 同意并生效 → H05；H05 主动关闭并生效 → H06。不增加“确认是否确定”的挽留弹层。", "note": "有授权也只使用范围内有效记录。 无记录或读取失败不阻断新会话。 不能用旧感受覆盖用户这次的表达。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">历史心情使用</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"118\" width=\"292\" height=\"119\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"145\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">新对话使用历史心情 · 开启</text><text x=\"38\" y=\"171\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">仅在授权范围内使用可用记录。</text><text x=\"38\" y=\"194\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">当前没有可用记录时，</text><text x=\"38\" y=\"217\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">只围绕你这次说的内容回应。</text><rect x=\"24\" y=\"270\" width=\"292\" height=\"115\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"297\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">引用时，让你知道</text><text x=\"38\" y=\"323\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">示例：“你昨天记录了更难受。</text><text x=\"38\" y=\"346\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">今天的感受，由你自己来说。”</text><text x=\"38\" y=\"369\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可以纠正，也可以关闭。</text><rect x=\"24\" y=\"423\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"450\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">关闭历史心情使用</text><rect x=\"24\" y=\"479\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"506\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回设置</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">引用只是过去自报；检索失败不假装记得。</text></g></svg>"}, "H06": {"id": "H06", "title": "关闭后 / 撤回生效", "desc": "H04 同意并生效 → H05；H05 主动关闭并生效 → H06。不增加“确认是否确定”的挽留弹层。", "note": "关闭停止后续调用并使缓存失效。 不会自动删除已存记录或关闭云端保存。 云端保存也独立可关：停止新增上传。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">历史心情使用</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"120\" width=\"292\" height=\"128\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"147\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">历史心情使用已关闭</text><text x=\"38\" y=\"173\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">后续对话不再调用历史心情。</text><text x=\"38\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">卡片和心情记录仍然保留。</text><text x=\"38\" y=\"219\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">云端保存的选择也保持不变。</text><rect x=\"24\" y=\"302\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"329\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回设置</text><rect x=\"24\" y=\"358\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"385\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">管理或删除心情记录</text><text x=\"24\" y=\"460\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">关闭使用与删除记录是两件事。</text><text x=\"24\" y=\"485\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">以后也可以重新查看授权说明。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">仅在确认关闭生效后显示；失败状态见 H12。</text></g></svg>"}, "H07": {"id": "H07", "title": "查看记录 / 来源清楚", "desc": "H07 管理记录 → H08；H01 清空我的数据 → H09。单条删除与全部清空不是连续必经步骤。", "note": "列表按实际状态标记本地或已同步。 修改保存失败保留原记录，允许重试。 修改不重复发奖，也不强行收回已领奖励。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">心情记录</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"120\" font-size=\"17\" font-weight=\"400\" fill=\"#30322f\">只记录你自己选择的感受。</text><rect x=\"24\" y=\"152\" width=\"292\" height=\"127\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"179\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">11 月 04 日 · 次日回看</text><text x=\"38\" y=\"205\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">比昨天好些</text><text x=\"38\" y=\"228\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">仅本地 · 关联心事卡</text><text x=\"38\" y=\"251\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">查看 / 修改 / 删除  ›</text><rect x=\"24\" y=\"300\" width=\"292\" height=\"127\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"327\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">11 月 03 日 · 次日回看</text><text x=\"38\" y=\"353\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">更难受</text><text x=\"38\" y=\"376\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">本地与云端 · 关联心事卡</text><text x=\"38\" y=\"399\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">查看 / 修改 / 删除  ›</text><text x=\"24\" y=\"470\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">这里不生成心理评分或情绪诊断。</text><rect x=\"24\" y=\"525\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"552\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回设置</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">空状态不催填写；读取失败不能显示成没有记录。</text></g></svg>"}, "H08": {"id": "H08", "title": "删除一条心情 / 保留卡片", "desc": "H07 管理记录 → H08；H01 清空我的数据 → H09。单条删除与全部清空不是连续必经步骤。", "note": "删除一条心情保留对应卡片；删卡则处理关联心情。仅确认后执行，单条删除不影响其他记录。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 记录</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">删除确认</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"120\" width=\"292\" height=\"159\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"147\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">删除这条心情记录？</text><text x=\"38\" y=\"173\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">11 月 03 日 · 更难受</text><text x=\"38\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">删除本地和已同步的关联记录。</text><text x=\"38\" y=\"219\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">后续不再用于历史心情调用。</text><text x=\"38\" y=\"242\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">关联心事卡仍保留。</text><rect x=\"24\" y=\"322\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"349\" font-size=\"15\" font-weight=\"500\" fill=\"white\">取消，保留记录</text><rect x=\"24\" y=\"378\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"405\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">确认删除这条记录</text><text x=\"24\" y=\"474\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">此操作只删除这一条心情记录。</text><text x=\"24\" y=\"499\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">卡片删除请到信箱操作。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">删卡会处理关联心情；删心情不反向删除卡片（建议）。</text></g></svg>"}, "H09": {"id": "H09", "title": "全部清空 / 展示影响范围", "desc": "H07 管理记录 → H08；H01 清空我的数据 → H09。单条删除与全部清空不是连续必经步骤。", "note": "清空覆盖当前会话、草稿、卡片和心情；同时关闭云端保存与历史使用，取消不改变数据。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">清空确认</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"111\" width=\"292\" height=\"211\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"138\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">清空当前使用身份的数据？</text><text x=\"38\" y=\"164\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">将清空本设备的：</text><text x=\"38\" y=\"187\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">未结束会话、草稿、已存心事卡</text><text x=\"38\" y=\"210\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">及心情记录；结束当前会话。</text><text x=\"38\" y=\"233\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">已同步云端的关联心情记录</text><text x=\"38\" y=\"256\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">将进入删除处理。</text><text x=\"38\" y=\"279\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">此操作不能恢复。</text><text x=\"24\" y=\"357\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">同时关闭云端保存和历史心情使用。</text><rect x=\"24\" y=\"410\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"437\" font-size=\"15\" font-weight=\"500\" fill=\"white\">取消，保留数据</text><rect x=\"24\" y=\"466\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"493\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">确认清空</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">建议清空后两项授权重置为关闭；不删除系统设置。</text></g></svg>"}, "H10": {"id": "H10", "title": "本地已移除 / 云端处理中", "desc": "H08 / H09 确认后按实际结果进入；单条与清空复用状态页，标题和处理范围动态变化。", "note": "云端无关联数据时无需展示等待任务。 不把提交请求等同于删除完成。 返回设置后可再次查看同一任务进度。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">数据处理进度</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"119\" width=\"292\" height=\"99\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"146\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">本地数据已移除</text><text x=\"38\" y=\"172\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">所选范围在本设备已不可访问。</text><text x=\"38\" y=\"195\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">后续不再用于历史调用。</text><rect x=\"24\" y=\"240\" width=\"292\" height=\"112\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"267\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">云端关联记录：处理中</text><text x=\"38\" y=\"293\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">已提交删除请求。</text><text x=\"38\" y=\"316\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">暂未完成，不显示全部清除。</text><text x=\"38\" y=\"339\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可以先离开，稍后查看进度。</text><rect x=\"24\" y=\"410\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"437\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回设置</text><text x=\"24\" y=\"491\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">不会因为关闭此页恢复已删除内容。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">按单条删除或全部清空显示实际范围；允许离开。</text></g></svg>"}, "H11": {"id": "H11", "title": "操作完成 / 如实说明范围", "desc": "H08 / H09 确认后按实际结果进入；单条与清空复用状态页，标题和处理范围动态变化。", "note": "本地失败时不能显示本地已经完成。 不承诺一键清除所有供应商和安全日志。 清空后回小屋；单条删除回记录页。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">数据处理进度</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"120\" width=\"292\" height=\"139\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"147\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">本次清空已完成</text><text x=\"38\" y=\"173\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">本设备会话、卡片和心情记录</text><text x=\"38\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">已清空；关联心情删除任务完成。</text><text x=\"38\" y=\"219\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">云端保存与历史调用均已关闭。</text><rect x=\"24\" y=\"310\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"337\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回小屋</text><rect x=\"24\" y=\"366\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"393\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">查看数据说明</text><text x=\"24\" y=\"463\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">本页只确认上述处理范围。</text><text x=\"24\" y=\"488\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">必要日志等按数据说明处理。</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">仅本地数据的删除可直接完成；单条删除后返回记录页。</text></g></svg>"}, "H12": {"id": "H12", "title": "部分失败 / 重试或离开", "desc": "H08 / H09 确认后按实际结果进入；单条与清空复用状态页，标题和处理范围动态变化。", "note": "重试只处理失败部分，不重复整个操作。 授权更新失败也保留真实状态和重试入口。 关闭待确认时本端先停用，不装作远端成功。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">数据处理进度</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"118\" width=\"292\" height=\"100\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"145\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">本地数据已移除</text><text x=\"38\" y=\"171\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这部分已经完成，</text><text x=\"38\" y=\"194\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不会因失败恢复。</text><rect x=\"24\" y=\"241\" width=\"292\" height=\"113\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"268\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">云端关联删除：暂未完成</text><text x=\"38\" y=\"294\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">后续使用已停用。</text><text x=\"38\" y=\"317\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可重试未完成的部分，</text><text x=\"38\" y=\"340\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">也可以先返回设置。</text><rect x=\"24\" y=\"408\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"435\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试未完成部分</text><rect x=\"24\" y=\"464\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"491\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回设置</text><text x=\"24\" y=\"621\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">若尚未确认停用，显示“待确认”，不声称已生效。</text></g></svg>"}, "J01": {"id": "J01", "title": "问题反馈 / 误判申诉", "desc": "从设置、对话菜单或边界提示进入，选择类型后可提交。补充说明选填，不默认附聊天或卡片正文。", "note": "日常理解偏差仍优先走“没理解对”。 申诉是独立入口，不自动传聊天正文。 提交中防重复操作，但允许返回或离开。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 返回</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">反馈与申诉</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"119\" font-size=\"18\" font-weight=\"400\" fill=\"#30322f\">想反馈哪一类问题？</text><rect x=\"24\" y=\"143\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"170\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 回应不合适</text><rect x=\"24\" y=\"194\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"221\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 功能或数据问题</text><rect x=\"24\" y=\"245\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"272\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">○ 我觉得被误判了</text><text x=\"24\" y=\"319\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">补充说明（选填）</text><rect x=\"24\" y=\"329\" width=\"292\" height=\"67\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"354\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可以简单说说，不必写隐私细节。</text><text x=\"24\" y=\"424\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">默认只提交类型和你填写的说明。</text><text x=\"24\" y=\"449\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">不会自动附上聊天或心事卡正文。</text><rect x=\"24\" y=\"481\" width=\"292\" height=\"43\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"508\" font-size=\"15\" font-weight=\"400\" fill=\"#73766f\">提交反馈</text><rect x=\"24\" y=\"541\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"568\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">暂不提交，返回</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">至少选一类；说明可留空，未选前提交不可用。</text></g></svg>"}, "J02": {"id": "J02", "title": "提交成功 / 清楚说明后续", "desc": "从设置、对话菜单或边界提示进入 J01；提交成功 → J02；明确失败 → J03。后两页为不同结果。", "note": "不承诺立即回复、即时恢复或人工接管。 没有状态查询能力时不放假进度入口。 无账号版本的反馈编号用于后续方案对齐。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">反馈已提交</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"121\" width=\"292\" height=\"119\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"148\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">我们已收到这条反馈</text><text x=\"38\" y=\"174\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">反馈编号：[提交成功后生成]</text><text x=\"38\" y=\"197\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">类型：我觉得被误判了（示例）</text><text x=\"38\" y=\"220\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不会要求你继续这段对话。</text><rect x=\"24\" y=\"274\" width=\"292\" height=\"123\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"301\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">后续处理</text><text x=\"38\" y=\"327\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">查看进度：[方式待确认]</text><text x=\"38\" y=\"350\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">处理时限：[待确认]</text><text x=\"38\" y=\"373\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这里不是实时人工救援入口。</text><rect x=\"24\" y=\"445\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"472\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回来源页面</text><rect x=\"24\" y=\"501\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"528\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">回到小屋</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">仅真实接收后展示成功；处理渠道与时限需补齐。</text></g></svg>"}, "J03": {"id": "J03", "title": "提交失败 / 保留填写内容", "desc": "从设置、对话菜单或边界提示进入 J01；提交成功 → J02；明确失败 → J03。后两页为不同结果。", "note": "失败不清空用户输入，也不强制继续填。 断网时说明未发出；未知结果先核对。 退出不把未提交内容当作成功反馈。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"20\" font-weight=\"600\" fill=\"#30322f\">反馈暂未提交</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"119\" width=\"292\" height=\"105\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"146\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这次没能提交成功</text><text x=\"38\" y=\"172\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">选择和补充说明还在。</text><text x=\"38\" y=\"195\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你可以重试，也可以先离开。</text><rect x=\"24\" y=\"250\" width=\"292\" height=\"106\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"277\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">本次填写</text><text x=\"38\" y=\"303\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我觉得被误判了</text><text x=\"38\" y=\"326\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">补充说明：我说的是过去的经历。</text><rect x=\"24\" y=\"401\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"428\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试提交</text><rect x=\"24\" y=\"456\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"483\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回修改</text><rect x=\"24\" y=\"511\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"538\" font-size=\"15\" font-weight=\"500\" fill=\"white\">先离开，回到小屋</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">重试不重复提交；结果未知时先核对，不假报失败。</text></g></svg>"}, "J04": {"id": "J04", "title": "断网 / 内容留在原处", "desc": "三个独立异常；根据消息是否发出、回应是否完成以及服务可用状态，显示不同处理。", "note": "只有确认没发出才显示“未发送”。 发送结果不明先核对，避免重复消息。 联网恢复后由用户决定是否继续发送。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"110\" width=\"292\" height=\"101\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"137\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">暂时没有连上网络</text><text x=\"38\" y=\"163\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">这条消息还没有发出。</text><text x=\"38\" y=\"186\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">输入内容仍然保留。</text><rect x=\"48\" y=\"241\" width=\"268\" height=\"95\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"62\" y=\"265\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">你 · 未发送</text><text x=\"62\" y=\"289\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">今天工作上有件事，</text><text x=\"62\" y=\"312\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我还想再说说。</text><rect x=\"24\" y=\"377\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"404\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">联网后重试发送</text><rect x=\"24\" y=\"432\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"459\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">返回修改输入</text><rect x=\"24\" y=\"487\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"514\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">回小屋不等于明确结束；不联网自动补发消息。</text></g></svg>"}, "J05": {"id": "J05", "title": "AI 回应失败 / 不重发用户消息", "desc": "三个独立异常；根据消息是否发出、回应是否完成以及服务可用状态，显示不同处理。", "note": "已有纠正和输入保留，不重开会话。 部分回复标为未完成，不当完整答案。 重试替换失败状态，不叠加同一回应。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"48\" y=\"112\" width=\"268\" height=\"99\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"62\" y=\"136\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">你</text><text x=\"62\" y=\"160\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我更在意的不是工作多，</text><text x=\"62\" y=\"183\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">而是付出没被看见。</text><rect x=\"24\" y=\"246\" width=\"292\" height=\"112\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"273\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">这次回应没有完成</text><text x=\"38\" y=\"299\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你的话仍在这段对话里。</text><text x=\"38\" y=\"322\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">可以重试回应，也可以先离开。</text><rect x=\"24\" y=\"394\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"421\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">重试这次回应</text><rect x=\"24\" y=\"450\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"477\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">继续输入</text><rect x=\"24\" y=\"506\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"533\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">结束这次对话</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">重试回应不重复发送用户消息；结束走 E01。</text></g></svg>"}, "J06": {"id": "J06", "title": "必要检查不可用 / 明确降级", "desc": "三个独立异常；根据消息是否发出、回应是否完成以及服务可用状态，显示不同处理。", "note": "暂缓新的 AI 生成，不封死退出。 不声称已连上人工；不隐藏失败原因。 已存正面可看，卡背生成仍需必要检查。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">服务暂不可用</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"119\" width=\"292\" height=\"133\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"146\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">现在暂时无法继续 AI 回应</text><text x=\"38\" y=\"172\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">必要的服务检查暂不可用。</text><text x=\"38\" y=\"195\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">输入和未结束会话仍保留。</text><text x=\"38\" y=\"218\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你可以稍后重试，或先离开。</text><rect x=\"24\" y=\"298\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"325\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">稍后重试</text><rect x=\"24\" y=\"353\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"380\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">查看本地已存心事</text><rect x=\"24\" y=\"408\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"435\" font-size=\"15\" font-weight=\"500\" fill=\"white\">回到小屋</text><text x=\"24\" y=\"493\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">如果此刻需要现实中的支持，</text><text x=\"24\" y=\"518\" font-size=\"14\" font-weight=\"400\" fill=\"#73766f\">可以联系信任的人。</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不绕过必要检查生成回复或卡背；本地内容仍可看。</text></g></svg>"}, "J07": {"id": "J07", "title": "意思不明确 / 温和澄清", "desc": "J07、J08 按上下文进入，不是所有用户必经页面；J09 可从设置主动查看。", "note": "少量必要澄清，不强制量表或追问。 用户仍可自由表达、纠正误判或离开。 上下文确认后按实际情况继续对话。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">和小屿聊聊</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><text x=\"24\" y=\"115\" font-size=\"12\" font-weight=\"400\" fill=\"#73766f\">小屿 · AI</text><rect x=\"24\" y=\"142\" width=\"268\" height=\"163\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"166\" font-size=\"12\" font-weight=\"600\" fill=\"#73766f\">小屿 · AI</text><text x=\"38\" y=\"190\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我想确认一下：你说的</text><text x=\"38\" y=\"213\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">“撑不下去”，是形容这件事</text><text x=\"38\" y=\"236\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">很难熬，还是你现在担心</text><text x=\"38\" y=\"259\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">自己会受到伤害？</text><text x=\"24\" y=\"340\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">按你的实际情况说就好</text><rect x=\"24\" y=\"350\" width=\"292\" height=\"78\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"375\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">我想补充的是……</text><rect x=\"24\" y=\"459\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"486\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">发送补充</text><rect x=\"24\" y=\"513\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"540\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">结束这次对话</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">可自由补充；不靠一个“没事”按钮自动取消判断。</text></g></svg>"}, "J08": {"id": "J08", "title": "需要即时支持 / 保留选择", "desc": "J07、J08 按上下文进入，不是所有用户必经页面；J09 可从设置主动查看。", "note": "不使用普通自由生成输出危险内容。 求助资源按地区与维护信息展示。 误判可申诉，不等同立即恢复所有能力。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 小屋</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">此刻的支持</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"111\" width=\"292\" height=\"138\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"138\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">先照顾此刻的安全</text><text x=\"38\" y=\"164\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">听起来你现在很难受。</text><text x=\"38\" y=\"187\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">如果此刻有立即的危险，</text><text x=\"38\" y=\"210\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">请联系当地紧急服务，</text><text x=\"38\" y=\"233\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">或请身边可信任的人陪着你。</text><text x=\"24\" y=\"278\" font-size=\"13\" font-weight=\"400\" fill=\"#73766f\">小屿是 AI，不能提供实时救援。</text><rect x=\"24\" y=\"310\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"337\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">查看当地求助资源（入口占位）</text><text x=\"24\" y=\"388\" font-size=\"12\" font-weight=\"500\" fill=\"#73766f\">你也可以继续告诉我</text><rect x=\"24\" y=\"398\" width=\"292\" height=\"60\" rx=\"10\" fill=\"white\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"36\" y=\"423\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">此刻我需要……</text><rect x=\"24\" y=\"482\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"509\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">发送</text><rect x=\"24\" y=\"537\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"564\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">回到小屋</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">资源需地区匹配与核验；这里不展示未经确认的号码。</text></g></svg>"}, "J09": {"id": "J09", "title": "服务边界 / 可随时查看", "desc": "J07、J08 按上下文进入，不是所有用户必经页面；J09 可从设置主动查看。", "note": "必要告知仍由入口组 A01 承接。 未成年误入按已告知准入规则处理。 边界与支持文案须专业复核后再定稿。", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 340 630\" role=\"img\" aria-label=\"手机低保真线框\"><style>text{font-family:PingFang SC,Microsoft YaHei,sans-serif}</style><g xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"0\" y=\"0\" width=\"340\" height=\"630\" rx=\"24\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"22\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">9:41</text><text x=\"274\" y=\"29\" font-size=\"12\" font-weight=\"400\" fill=\"#30322f\">▰ ▰</text><text x=\"22\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">‹ 设置</text><text x=\"195\" y=\"69\" font-size=\"16\" font-weight=\"600\" fill=\"#30322f\">关于暖屿</text><path d=\"M20 88H320\" stroke=\"#c4c6be\" /><rect x=\"24\" y=\"115\" width=\"292\" height=\"105\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"142\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">暖屿可以做什么</text><text x=\"38\" y=\"168\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">陪你表达日常心事，</text><text x=\"38\" y=\"191\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">一起澄清理解、整理心事卡。</text><rect x=\"24\" y=\"242\" width=\"292\" height=\"148\" rx=\"10\" fill=\"#f0f1ec\" stroke=\"#c4c6be\" stroke-width=\"1.4\" /><text x=\"38\" y=\"269\" font-size=\"15\" font-weight=\"600\" fill=\"#30322f\">需要知道的边界</text><text x=\"38\" y=\"295\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">小屿是 AI，可能理解不准确。</text><text x=\"38\" y=\"318\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">不能提供诊断、治疗或实时救援。</text><text x=\"38\" y=\"341\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">你可以纠正、停止或反馈。</text><text x=\"38\" y=\"364\" font-size=\"14\" font-weight=\"400\" fill=\"#30322f\">当前试点面向成年人。</text><rect x=\"24\" y=\"432\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"459\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">反馈或申诉</text><rect x=\"24\" y=\"486\" width=\"292\" height=\"43\" rx=\"7\" fill=\"white\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"513\" font-size=\"15\" font-weight=\"500\" fill=\"#30322f\">查看数据说明</text><rect x=\"24\" y=\"540\" width=\"292\" height=\"43\" rx=\"7\" fill=\"#30322f\" stroke=\"#30322f\" stroke-width=\"1.4\" /><text x=\"38\" y=\"567\" font-size=\"15\" font-weight=\"500\" fill=\"white\">返回设置</text><text x=\"24\" y=\"604\" font-size=\"10\" font-weight=\"400\" fill=\"#73766f\">不把声明当作替代安全处理；不承诺疗效或全天人工。</text></g></svg>"}, "H10-single": {"id": "H10-single", "title": "单条心情删除处理中", "desc": "仅移除选中的那条心情记录；对应卡片、其他记录和授权选择保持不变。", "note": "云端无关联数据时无需展示等待任务。 不
